<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Mini-Titan</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12432f"/>
      <stop offset="1" stop-color="#1f9d4d"/>
    </linearGradient>
    <radialGradient id="lueur" cx="256" cy="120" r="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38e8ff" stop-opacity=".65"/>
      <stop offset=".25" stop-color="#38e8ff" stop-opacity=".39"/>
      <stop offset=".5" stop-color="#38e8ff" stop-opacity=".163"/>
      <stop offset=".75" stop-color="#38e8ff" stop-opacity=".039"/>
      <stop offset="1" stop-color="#38e8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ombre">
      <stop offset="0" stop-color="#04180c" stop-opacity=".65"/>
      <stop offset=".25" stop-color="#04180c" stop-opacity=".39"/>
      <stop offset=".5" stop-color="#04180c" stop-opacity=".163"/>
      <stop offset=".75" stop-color="#04180c" stop-opacity=".039"/>
      <stop offset="1" stop-color="#04180c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="peau" x1="0" y1="126" x2="0" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4cbd5f"/>
      <stop offset="1" stop-color="#35a149"/>
    </linearGradient>
  </defs>

  <!-- fond -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- la tête (même dessin que icons/make-icons.ps1) -->
  <g transform="translate(256 256) scale(1.1) translate(-256 -224)">
    <circle cx="256" cy="120" r="128" fill="url(#lueur)"/>
    <ellipse cx="256" cy="400" rx="180" ry="42" fill="url(#ombre)"/>

    <!-- plaques dorsales -->
    <g fill="#38e8ff" stroke="#0c2b17" stroke-width="10" stroke-linejoin="round">
      <path d="M 186 84 C 202 100 222 124 236 150 L 152 186 C 152 150 166 110 186 84 Z"/>
      <path d="M 326 84 C 310 100 290 124 276 150 L 360 186 C 360 150 346 110 326 84 Z"/>
      <path d="M 256 44 C 268 74 296 118 306 160 L 206 160 C 216 118 244 74 256 44 Z"/>
    </g>
    <g fill="#b6fbff" opacity=".8">
      <path d="M 190 122 C 198 131 209 144 217 158 L 171 178 C 171 158 179 136 190 122 Z"/>
      <path d="M 322 122 C 314 131 303 144 295 158 L 341 178 C 341 158 333 136 322 122 Z"/>
      <path d="M 256 90 C 263 108 280 135 286 160 L 226 160 C 232 135 249 108 256 90 Z"/>
    </g>

    <!-- tête -->
    <path d="M 256 132 C 340 132 408 180 414 262 C 420 340 372 404 256 404 C 140 404 92 340 98 262 C 104 180 172 132 256 132 Z" fill="url(#peau)"/>
    <ellipse cx="190" cy="190" rx="56" ry="22" fill="#7fe08a" opacity=".45" transform="rotate(-26 190 190)"/>
    <ellipse cx="256" cy="340" rx="104" ry="56" fill="#f6eea6"/>
    <ellipse cx="132" cy="318" rx="20" ry="13" fill="#ff9db0" opacity=".85"/>
    <ellipse cx="380" cy="318" rx="20" ry="13" fill="#ff9db0" opacity=".85"/>
    <path d="M 256 132 C 340 132 408 180 414 262 C 420 340 372 404 256 404 C 140 404 92 340 98 262 C 104 180 172 132 256 132 Z" fill="none" stroke="#0c2b17" stroke-width="10" stroke-linejoin="round"/>

    <!-- yeux -->
    <ellipse cx="186" cy="256" rx="26" ry="30" fill="#0c2b17"/>
    <ellipse cx="326" cy="256" rx="26" ry="30" fill="#0c2b17"/>
    <circle cx="177" cy="245" r="10" fill="#fff"/>
    <circle cx="317" cy="245" r="10" fill="#fff"/>
    <circle cx="195" cy="269" r="4.5" fill="#fff" opacity=".9"/>
    <circle cx="335" cy="269" r="4.5" fill="#fff" opacity=".9"/>

    <!-- museau -->
    <ellipse cx="239" cy="316" rx="4.5" ry="6.5" fill="#0c2b17" opacity=".92"/>
    <ellipse cx="273" cy="316" rx="4.5" ry="6.5" fill="#0c2b17" opacity=".92"/>
    <path d="M 214 346 C 232 368 280 368 298 346" fill="none" stroke="#0c2b17" stroke-width="8" stroke-linecap="round"/>
    <path d="M 272 359 L 281 376 L 290 353 Z" fill="#fff" stroke="#0c2b17" stroke-width="4" stroke-linejoin="round"/>
  </g>
</svg>
