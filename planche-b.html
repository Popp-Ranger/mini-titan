<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini-Titan — planche B</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: #e9ecf2; color: #1c2230; }
  header { padding: 14px 18px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; background: #fff; border-bottom: 1px solid #d5dae4; }
  header h1 { font-size: 17px; margin: 0; }
  header a { color: #3557d6; text-decoration: none; padding: 3px 8px; border-radius: 999px; background: #eef1fb; }
  header a.on { background: #3557d6; color: #fff; }
  section { padding: 16px 18px 26px; }
  section.light { background: #eef0f4; color: #1c2230; }
  section.dark { background: #151a26; color: #e8ecf6; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: 96px repeat(6, minmax(0, 1fr)); gap: 4px 6px; align-items: end; max-width: 1180px; }
  .grid .lab { font-weight: 600; align-self: center; }
  .grid .col { font-size: 12px; opacity: .7; text-align: center; align-self: center; }
  .cell { position: relative; }
  .cell svg { width: 100%; height: auto; }
  .row { display: flex; flex-wrap: wrap; gap: 6px 10px; max-width: 1180px; }
  .row figure { margin: 0; width: 150px; text-align: center; font-size: 12px; }
  .row figure svg { width: 150px; height: 150px; }
  .big { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
  .stagebox { width: 500px; max-width: 100%; }
  .stagebox svg { width: 100%; height: auto; }
  .ctl { display: flex; flex-direction: column; gap: 10px; max-width: 420px; }
  .ctl div { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; padding: 7px 12px; border-radius: 10px; border: 1px solid #b9c1d3; background: #fff; color: #1c2230; cursor: pointer; }
  button.on { background: #3557d6; border-color: #3557d6; color: #fff; }
  .sizes { display: flex; align-items: flex-end; gap: 14px; margin-top: 14px; }
</style>
</head>
<body>
<header>
  <h1>Planche de contrôle — direction B (cartoon premium à contour)</h1>
  <nav id="nav"></nav>
  <span id="info"></span>
</header>
<main id="main"></main>

<script src="js/skins.js"></script>
<script src="js/art-b.js"></script>
<script>
(function () {
  var art = MT.arts.b, SK = MT.SKINS, q = new URLSearchParams(location.search),
    sel = Math.max(0, Math.min(SK.length - 1, parseInt(q.get('skin') || '0', 10) || 0)),
    only = q.get('only') || '', uidN = 0,
    MOODS = ['neutral', 'happy', 'love', 'sad', 'angry', 'sick', 'sleep', 'eat', 'surprised'],
    MOOD_FR = { neutral: 'neutre', happy: 'content', love: 'amoureux', sad: 'triste', angry: 'fâché', sick: 'malade', sleep: 'dodo', eat: 'mange', surprised: 'surpris' },
    COLS = [['Œuf', { stage: 0 }], ['Bébé', { stage: 1 }], ['Enfant', { stage: 2 }], ['Ado', { stage: 3 }], ['Adulte titan', { stage: 4, form: 'titan' }], ['Adulte grognon', { stage: 4, form: 'grognon' }]];

  var st = document.createElement('style'); st.textContent = art.css; document.head.appendChild(st);
  /* ?still=1 : fige les animations au repos (captures d'écran nettes et légères) */
  if (q.get('still') === '1') { var fz = document.createElement('style'); fz.textContent = '.mt-mon *{animation:none!important}'; document.head.appendChild(fz); }

  function mon(skin, o) {
    var opts = { stage: o.stage, form: o.form || '', mood: o.mood || 'neutral', dead: !!o.dead, crack: o.crack || 0, uid: 'p' + (uidN++) };
    return art.monster(skin, opts);
  }
  function fig(svg, label) { return '<figure>' + svg + '<figcaption>' + label + '</figcaption></figure>'; }

  function gridHTML() {
    var h = '<div class="grid"><div></div>' + COLS.map(function (c) { return '<div class="col">' + c[0] + '</div>'; }).join('');
    SK.forEach(function (s, i) {
      h += '<div class="lab">' + i + ' · ' + s.name + '</div>' + COLS.map(function (c) { return '<div class="cell">' + mon(s, c[1]) + '</div>'; }).join('');
    });
    return h + '</div>';
  }
  function moodsHTML() {
    var s = SK[sel], h = '<h2>Humeurs — bébé</h2><div class="row">';
    MOODS.forEach(function (m) { h += fig(mon(s, { stage: 1, mood: m }), MOOD_FR[m]); });
    h += '</div><h2>Humeurs — enfant et ado</h2><div class="row">';
    MOODS.forEach(function (m, i) { h += fig(mon(s, { stage: i % 2 ? 3 : 2, mood: m }), MOOD_FR[m]); });
    h += '</div><h2>Humeurs — adulte titan</h2><div class="row">';
    MOODS.forEach(function (m) { h += fig(mon(s, { stage: 4, form: 'titan', mood: m }), MOOD_FR[m]); });
    h += '</div><h2>Humeurs — adulte grognon</h2><div class="row">';
    MOODS.forEach(function (m) { h += fig(mon(s, { stage: 4, form: 'grognon', mood: m }), MOOD_FR[m]); });
    h += '</div><h2>Fantôme (bébé, ado, adulte) et fissures de l\'œuf</h2><div class="row">';
    [1, 3, 4].forEach(function (g) { h += fig(mon(s, { stage: g, dead: true }), 'fantôme stade ' + g); });
    [0, 1, 2, 3].forEach(function (k) { h += fig(mon(s, { stage: 0, crack: k }), 'fissure ' + k); });
    return h + '</div>';
  }

  var main = document.getElementById('main'), html = '';
  ['light', 'dark'].forEach(function (theme) {
    if (!only || only === 'grid') html += '<section class="' + theme + '"><h2>Les 10 looks × 6 stades (humeur neutre)</h2>' + gridHTML() + '</section>';
    if (!only || only === 'moods') html += '<section class="' + theme + '"><h2>Look ' + sel + ' · ' + SK[sel].name + '</h2>' + moodsHTML() + '</section>';
  });
  if (!only || only === 'big') {
    html += '<section class="light" id="bigsec"><h2>Grand format et actions — look ' + sel + ' · ' + SK[sel].name + '</h2><div class="big"><div class="stagebox" id="stagebox"></div>' +
      '<div class="ctl"><div id="b-stage"></div><div id="b-mood"></div><div id="b-act"></div><div><button id="b-bg">Fond clair / sombre</button></div>' +
      '<div class="sizes" id="sizes"></div></div></div></section>';
  }
  main.innerHTML = html;

  /* navigation */
  var nav = document.getElementById('nav');
  nav.innerHTML = SK.map(function (s, i) { return '<a class="' + (i === sel ? 'on' : '') + '" href="?skin=' + i + (only ? '&only=' + only : '') + '">' + i + '</a>'; }).join(' ') +
    ' &nbsp; ' + ['', 'grid', 'moods', 'big'].map(function (o) { return '<a class="' + (o === only ? 'on' : '') + '" href="?skin=' + sel + (o ? '&only=' + o : '') + '">' + (o || 'tout') + '</a>'; }).join(' ');

  /* grand format */
  var box = document.getElementById('stagebox');
  if (box) {
    if (q.get('w')) box.style.width = parseInt(q.get('w'), 10) + 'px';      /* ?w=760 : grand format plus large */
    if (q.get('bg') === 'dark') document.getElementById('bigsec').className = 'dark';
    var cur = { stage: parseInt(q.get('stage') || '4', 10), form: q.get('form') || 'titan', mood: q.get('mood') || 'neutral', dead: q.get('dead') === '1', crack: parseInt(q.get('crack') || '0', 10) }, timer = 0;
    var draw = function () {
      box.innerHTML = art.monster(SK[sel], { stage: cur.stage, form: cur.form, mood: cur.mood, dead: cur.dead, crack: cur.crack, uid: 'big' });
      var raw = box.innerHTML.length;
      document.getElementById('info').textContent = 'SVG affiché : ' + (raw / 1024).toFixed(1) + ' Ko';
      document.getElementById('sizes').innerHTML = [120, 72, 48].map(function (w, i) {
        return '<div style="width:' + w + 'px">' + art.monster(SK[sel], { stage: cur.stage, form: cur.form, mood: cur.mood, dead: cur.dead, crack: cur.crack, uid: 'sz' + i }) + '</div>';
      }).join('');
    };
    var group = function (id, items, fn) {
      var el = document.getElementById(id);
      items.forEach(function (it) {
        var b = document.createElement('button'); b.textContent = it[0];
        b.onclick = function () { fn(it[1], b); };
        el.appendChild(b);
      });
    };
    group('b-stage', COLS.concat([['Fantôme', { dead: true }], ['Œuf fissuré', { stage: 0, crack: 3 }]]), function (v) {
      cur.dead = !!v.dead; if (v.stage != null) cur.stage = v.stage; cur.form = v.form || ''; cur.crack = v.crack || 0; draw();
    });
    group('b-mood', MOODS.map(function (m) { return [MOOD_FR[m], m]; }), function (v) { cur.mood = v; draw(); });
    group('b-act', [['Saut de joie', 'mt-act-jump'], ['Mâche', 'mt-act-chomp'], ['Non !', 'mt-act-no'], ['Se tortille', 'mt-act-wiggle'], ['Sautille', 'mt-act-hop']], function (cls) {
      clearTimeout(timer);
      box.className = 'stagebox'; void box.offsetWidth;
      box.classList.add(cls);
      timer = setTimeout(function () { box.classList.remove(cls); }, 1200);
    });
    document.getElementById('b-bg').onclick = function () {
      var s = document.getElementById('bigsec'); s.className = s.className === 'light' ? 'dark' : 'light';
    };
    window.planche = { draw: draw, cur: cur, box: box };
    draw();
  }
})();
</script>
</body>
</html>
