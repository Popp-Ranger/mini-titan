<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini-Titan — planche de contrôle « c »</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #e9ebf1; color: #1c2030; }
  header { padding: 14px 18px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; background: #fff; border-bottom: 1px solid #d9dce6; }
  header h1 { font-size: 17px; margin: 0; }
  header a { color: #3558d6; text-decoration: none; padding: 3px 8px; border-radius: 8px; }
  header a.on { background: #3558d6; color: #fff; }
  section { padding: 16px 18px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .panel { border-radius: 18px; padding: 12px; margin-bottom: 16px; }
  .light { background: #f4f5f9; color: #1c2030; }
  .dark { background: #1a1d2a; color: #e8eaf4; }
  .grid { display: grid; grid-template-columns: 92px repeat(6, minmax(0, 1fr)); gap: 4px; align-items: end; }
  .grid .lab { font-size: 12px; opacity: .75; align-self: center; }
  .grid .col { font-size: 12px; opacity: .75; text-align: center; padding-bottom: 4px; }
  .cell { position: relative; }
  .cell svg { display: block; width: 100%; height: auto; }
  .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cell, 150px), 1fr)); gap: 6px; }
  .row .cell span { display: block; text-align: center; font-size: 12px; opacity: .75; }
  .bigwrap { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .big { width: 500px; max-width: 100%; }
  .big svg { display: block; width: 100%; height: auto; }
  .ctl { display: flex; flex-wrap: wrap; gap: 8px; max-width: 520px; padding: 8px 0; }
  button, select { font: inherit; padding: 8px 14px; border-radius: 12px; border: 1px solid #c8ccd9; background: #fff; color: #1c2030; cursor: pointer; }
  button:active { transform: scale(.97); }
</style>
</head>
<body>
<header>
  <h1>Mini-Titan — planche « c » : <span id="artname"></span></h1>
  <nav id="nav"></nav>
  <nav id="skins"></nav>
</header>
<main id="main"></main>

<script src="js/skins.js"></script>
<script src="js/art-c.js"></script>
<script>
(function () {
  var art = MT.arts.c, SK = MT.SKINS, q = {}, n = 0;
  location.search.replace(/^\?/, '').split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) q[p[0]] = decodeURIComponent(p[1] || ''); });
  var skinIdx = Math.max(0, Math.min(SK.length - 1, parseInt(q.skin, 10) || 0)), only = q.only || '', bg = q.bg || '';
  var skin = SK[skinIdx];

  var st = document.createElement('style'); st.textContent = art.css; document.head.appendChild(st);
  document.getElementById('artname').textContent = art.name;

  function link(label, params, on) {
    var p = [], k; for (k in params) if (params[k] !== '' && params[k] != null) p.push(k + '=' + encodeURIComponent(params[k]));
    return '<a class="' + (on ? 'on' : '') + '" href="?' + p.join('&') + '">' + label + '</a>';
  }
  document.getElementById('nav').innerHTML = [['Tout', ''], ['Grille', 'grid'], ['Stades', 'stages'], ['Humeurs', 'moods'], ['Grand', 'big']].map(function (x) {
    return link(x[0], { skin: skinIdx, only: x[1], bg: bg }, only === x[1]);
  }).join('');
  document.getElementById('skins').innerHTML = SK.map(function (s, i) { return link(s.name, { skin: i, only: only, bg: bg }, i === skinIdx); }).join('');

  function mon(sk, o) { o.uid = 'p' + (n++); return art.monster(sk, o); }
  function cell(sk, o, label) { return '<div class="cell">' + mon(sk, o) + (label ? '<span>' + label + '</span>' : '') + '</div>'; }
  var COLS = [['Œuf', { stage: 0 }], ['Bébé', { stage: 1 }], ['Enfant', { stage: 2 }], ['Ado', { stage: 3 }], ['Adulte titan', { stage: 4, form: 'titan' }], ['Adulte grognon', { stage: 4, form: 'grognon' }]];
  var MOODS = [['neutral', 'Neutre'], ['happy', 'Content'], ['love', 'Amoureux'], ['sad', 'Triste'], ['angry', 'En colère'], ['sick', 'Malade'], ['sleep', 'Dodo'], ['eat', 'Mange'], ['surprised', 'Surpris']];
  var BGS = bg === 'light' ? ['light'] : bg === 'dark' ? ['dark'] : ['light', 'dark'];
  function copy(o, extra) { var r = {}, k; for (k in o) r[k] = o[k]; for (k in extra) r[k] = extra[k]; return r; }

  function grid() {
    var h = '<div class="grid"><div></div>' + COLS.map(function (c) { return '<div class="col">' + c[0] + '</div>'; }).join('');
    var from = parseInt(q.from, 10) || 0, to = q.to === undefined ? SK.length - 1 : parseInt(q.to, 10);   /* captures : ?from=a&to=b */
    SK.forEach(function (sk, si) {
      if (si < from || si > to) return;
      h += '<div class="lab">' + sk.name + '</div>' + COLS.map(function (c) { return cell(sk, copy(c[1], { mood: 'neutral' })); }).join('');
    });
    return h + '</div>';
  }
  function moods() {
    var h = '<h2>' + skin.name + ' — humeurs, bébé</h2><div class="row">' + MOODS.map(function (m) { return cell(skin, { stage: 1, mood: m[0] }, m[1]); }).join('') + '</div>';
    h += '<h2 style="margin-top:14px">' + skin.name + ' — humeurs, adulte titan</h2><div class="row">' + MOODS.map(function (m) { return cell(skin, { stage: 4, form: 'titan', mood: m[0] }, m[1]); }).join('') + '</div>';
    h += '<h2 style="margin-top:14px">' + skin.name + ' — humeurs, enfant / ado / grognon</h2><div class="row">' +
      ['happy', 'sad', 'eat'].map(function (m) { return cell(skin, { stage: 2, mood: m }, 'Enfant ' + m); }).join('') +
      ['happy', 'angry', 'sleep'].map(function (m) { return cell(skin, { stage: 3, mood: m }, 'Ado ' + m); }).join('') +
      ['happy', 'angry', 'eat', 'love'].map(function (m) { return cell(skin, { stage: 4, form: 'grognon', mood: m }, 'Grognon ' + m); }).join('') + '</div>';
    h += '<h2 style="margin-top:14px">Fantômes et fissures de l\'œuf</h2><div class="row">' +
      [1, 2, 3, 4].map(function (s) { return cell(skin, { stage: s, dead: true, form: 'titan' }, 'Fantôme stade ' + s); }).join('') +
      [0, 1, 2, 3].map(function (k) { return cell(skin, { stage: 0, crack: k }, 'Fissure ' + k); }).join('') + '</div>';
    return h;
  }
  if (q.part) {   /* captures : ?only=moods&part=0..3 n'affiche qu'un des quatre blocs */
    var fullMoods = moods;
    moods = function () { var parts = fullMoods().split('<h2'); return '<h2' + parts[1 + (parseInt(q.part, 10) || 0)].replace(' style="margin-top:14px"', ''); };
  }

  var html = '';
  if (!only || only === 'grid') BGS.forEach(function (b) { html += '<section><div class="panel ' + b + '"><h2>Grille — 10 looks × 6 stades</h2>' + grid() + '</div></section>'; });
  if (only === 'stages') BGS.forEach(function (b) {
    html += '<section><div class="panel ' + b + '"><h2>' + skin.name + ' — les 6 stades en grand</h2><div class="row" style="grid-template-columns:repeat(3,minmax(0,1fr))">' +
      COLS.map(function (c) { return cell(skin, copy(c[1], { mood: q.mood || 'neutral', crack: +(q.crack || 0) }), c[0]); }).join('') + '</div></div></section>';
  });
  if (!only || only === 'moods') BGS.forEach(function (b) { html += '<section><div class="panel ' + b + '">' + moods() + '</div></section>'; });
  if (!only || only === 'big') {
    html += '<section><div class="panel ' + (bg === 'dark' ? 'dark' : 'light') + '" id="bigpanel"><h2>Grand format et actions</h2><div class="bigwrap"><div class="big" id="big"></div><div>' +
      '<div class="ctl" id="acts">' + [['jump', 'Saut'], ['chomp', 'Mâche'], ['no', 'Non'], ['wiggle', 'Tortille'], ['hop', 'Sautille']].map(function (a) { return '<button data-act="' + a[0] + '">' + a[1] + '</button>'; }).join('') + '</div>' +
      '<div class="ctl"><select id="selStage">' + COLS.map(function (c, i) { return '<option value="' + i + '"' + (i === 4 ? ' selected' : '') + '>' + c[0] + '</option>'; }).join('') + '</select>' +
      '<select id="selMood">' + MOODS.map(function (m) { return '<option value="' + m[0] + '">' + m[1] + '</option>'; }).join('') + '</select>' +
      '<select id="selDead"><option value="">Vivant</option><option value="1">Fantôme</option></select>' +
      '<button id="togBg">Fond clair / sombre</button></div><div id="info" style="opacity:.7"></div></div></div></div></section>';
  }
  document.getElementById('main').innerHTML = html;
  if (q.cell) document.documentElement.style.setProperty('--cell', parseInt(q.cell, 10) + 'px');
  if (q.vb && only !== 'big') Array.prototype.forEach.call(document.querySelectorAll('.row svg'), function (el) { el.setAttribute('viewBox', q.vb.split(',').join(' ')); el.style.overflow = 'hidden'; });
  if (q.hide) document.querySelector('header').style.display = 'none';      /* captures : sans en-tête */
  if (q.y) setTimeout(function () { window.scrollTo(0, parseInt(q.y, 10) || 0); }, 50);

  var big = document.getElementById('big');
  if (big) {
    var selStage = document.getElementById('selStage'), selMood = document.getElementById('selMood'), selDead = document.getElementById('selDead');
    if (q.stage) selStage.value = q.stage;
    if (q.mood) selMood.value = q.mood;
    if (q.dead) selDead.value = '1';
    var draw = function () {
      var o = copy(COLS[+selStage.value][1], { mood: selMood.value, dead: selDead.value === '1', crack: +(q.crack || 0), uid: 'big' });
      var svg = art.monster(skin, o);
      big.innerHTML = svg;
      if (q.vb) big.firstChild.setAttribute('viewBox', q.vb.split(',').join(' '));   /* loupe pour inspecter : ?vb=x,y,l,h */
      document.getElementById('info').textContent = 'Poids du SVG : ' + (svg.length / 1024).toFixed(1) + ' Ko';
    };
    selStage.onchange = selMood.onchange = selDead.onchange = draw;
    draw();
    var timer = 0;
    document.getElementById('acts').addEventListener('click', function (ev) {
      var a = ev.target.getAttribute('data-act'); if (!a) return;
      clearTimeout(timer);
      big.className = 'big'; void big.offsetWidth;
      big.className = 'big mt-act-' + a;
      timer = setTimeout(function () { big.className = 'big'; }, 1200);
    });
    document.getElementById('togBg').onclick = function () { var p = document.getElementById('bigpanel'); p.className = 'panel ' + (/dark/.test(p.className) ? 'light' : 'dark'); };
  }
})();
</script>
</body>
</html>
